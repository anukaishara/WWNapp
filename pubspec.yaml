name: wwn_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    
  # Core Dependencies
  cupertino_icons: ^1.0.8
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  firebase_analytics: 11.5.0
  
  # Authentication
  google_sign_in: ^6.1.4
  flutter_facebook_auth: ^6.2.0
  
  # HTTP and Data
  http: ^1.2.0
  html: ^0.15.0
  rss_dart: ^1.0.12
  html_tags_cleaner: ^0.0.3
  
  # Storage and Preferences
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI and Utilities
  provider: ^6.0.5
  image_picker: ^1.0.7
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.3.1
  flutter_staggered_animations: ^1.1.1
  flutter_otp_text_field: ^1.1.1
  url_launcher: ^6.1.10
  
  # Search (Use only compatible packages)
  algolia_client_search: ^1.36.0     # search/analytics
  algoliasearch: ^1.36.0        # For write/indexing operations

  connectivity_plus: ^6.0.5
  shared_preferences: ^2.2.3
  
  # Email
  mailer: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10
  
  # Code Generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/icons/app_icon.png
  android: true
  ios: true
